# Local development stack: every service, its datastores and the broker, in one command.
#
#   docker compose up -d --build      then open http://localhost:4173
#
# Sign in as somchai@acme.example / somchai-recruiter-password (recruiter) or
# nok@acme.example / nok-admin-demo-password (admin): the Identity Service's synthetic seed.
#
# Published on the host: the web app, the gateway (for Postman), the RabbitMQ and MinIO consoles,
# and the ports the services' own tests and tools use. Every host port can be moved with a
# variable, for example in a .env file next to this one (which Git ignores):
#
#   POSTGRES_PORT=55432
#   MONGO_PORT=57017
#
# The Identity Service is reachable only inside the stack. The web app reaches every other
# service through the gateway, as it would in a deployment.
#
# Credentials here are for local use only; never reuse them elsewhere.
name: hireassist

services:
  # ── Datastores and broker (ADR-003) ─────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hireassist
      POSTGRES_PASSWORD: hireassist
      POSTGRES_DB: hiring
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireassist -d hiring"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The Identity Service's own database, created and seeded from its schema and seed scripts.
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./services/identity/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One MongoDB server, one database per service: Hiring's interview guides, and Resume
  # Processing's profiles and screenings (ADR-003). Neither reads the other's database.
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Carries the screening handover between Hiring and Resume Processing
  # (services/resume-processing/MESSAGES.md). The management UI, at http://localhost:15672
  # (hireassist / hireassist), shows the queues and the messages in them.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hireassist
      RABBITMQ_DEFAULT_PASS: hireassist
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # S3-compatible object storage for resume files. MinIO no longer publishes free images on
  # Docker Hub or quay.io; Chainguard's build of it is maintained and free, as `latest` only. The
  # console is at http://localhost:9001 (hireassist / hireassist-local).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: hireassist
      MINIO_ROOT_PASSWORD: hireassist-local   # MinIO wants at least 8 characters
      MC_CONFIG_DIR: /tmp/.mc                 # where the health check's mc may write
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Services ────────────────────────────────────────────────────────────────────────────

  # Canned answers, so no API key is needed — each is labelled `canned` in what it returns. For a
  # real model, set in .env AI_SERVICE_PROVIDER to anthropic or openai and AI_SERVICE_API_KEY to
  # that provider's key; AI_SERVICE_MODEL picks a model other than the provider's default. The
  # first start installs its dependencies.
  ai-service:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /repo/services/ai-service
    volumes:
      - ./proto:/repo/proto:ro
      - ./services/ai-service:/repo/services/ai-service
    environment:
      AI_SERVICE_PROVIDER: "${AI_SERVICE_PROVIDER-canned}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY:-}"
      AI_SERVICE_MODEL: "${AI_SERVICE_MODEL:-}"
      UV_PROJECT_ENVIRONMENT: /opt/venv   # keeps the Linux virtualenv out of the working tree
    entrypoint: ["sh", "-c"]
    command:
      - |
        uv sync --frozen &&
        mkdir -p src/ai_service/gen && touch src/ai_service/gen/__init__.py &&
        uv run python -m grpc_tools.protoc -I../../proto --python_out=src/ai_service/gen --pyi_out=src/ai_service/gen --grpc_python_out=src/ai_service/gen ../../proto/hireassist/ai/v1/ai_service.proto &&
        find src/ai_service/gen -name '*_pb2_grpc.py' -exec sed -i 's/^from hireassist/from ai_service.gen.hireassist/' {} + &&
        uv run python -m ai_service
    ports:
      - "${AI_SERVICE_PORT:-50051}:50051"

  resume-processing:
    build:
      context: .
      dockerfile: services/resume-processing/Dockerfile
    environment:
      AMQP_URL: amqp://hireassist:hireassist@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: hireassist
      S3_SECRET_KEY: hireassist-local
      MONGO_URL: mongodb://mongo:27017
      AI_SERVICE_ADDR: ai-service:50051
    ports:
      - "${RESUME_PROCESSING_PORT:-3000}:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started

  hiring:
    build: ./services/hiring
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://hireassist:hireassist@postgres:5432/hiring?sslmode=disable
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: hiring
      RABBITMQ_URL: amqp://hireassist:hireassist@rabbitmq:5672/
      OBJECT_STORE_ENDPOINT: minio:9000
      OBJECT_STORE_ACCESS_KEY: hireassist
      OBJECT_STORE_SECRET_KEY: hireassist-local
      OBJECT_STORE_BUCKET: resumes
      RESUME_PROCESSING_URL: "${RESUME_PROCESSING_URL:-http://resume-processing:3000}"
      AI_SERVICE_ADDRESS: "${AI_SERVICE_ADDRESS:-ai-service:50051}"
    ports:
      - "${HIRING_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Creates the development signing key pair on first start, in the jwt-keys volume, and holds
  # the private half (ADR-009). `docker compose down -v` discards it with the data.
  identity:
    build:
      context: .
      dockerfile: deploy/dev-keys/identity.Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://identity:identity@identity-db:5432/identity?sslmode=disable
      JWT_KEY_ID: dev-1
    volumes:
      - jwt-keys:/keys
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Holds only the public half of the key (ADR-009).
  gateway:
    build:
      context: .
      dockerfile: deploy/dev-keys/gateway.Dockerfile
    environment:
      PORT: "8000"
      IDENTITY_URL: http://identity:8081
      HIRING_URL: http://hiring:8080
      # The web app's refresh cookie is Secure by default; this stack serves plain HTTP.
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - jwt-keys:/keys:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      identity:
        condition: service_healthy
      hiring:
        condition: service_started

  # The web app, built against the gateway. nginx strips /api and forwards to the gateway.
  web:
    build: ./services/web
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      - gateway

  # ── Database UIs, for looking at the data (not part of the system) ──────────────────────
  # Off by default: `docker compose --profile tools up -d`.

  # PostgreSQL in the browser: http://localhost:8082 — server postgres, user and password
  # hireassist, database hiring.
  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - postgres

  # MongoDB in the browser: http://localhost:8083 — databases hiring (interview guides) and
  # hireassist_resume_processing (candidate profiles, screening results).
  mongo-express:
    image: mongo-express:1.0.2-20
    profiles: [tools]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_ENABLED: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8083}:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  postgres-data:
  identity-data:
  mongo-data:
  jwt-keys:
  rabbitmq-data:
  minio-data:
