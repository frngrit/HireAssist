[project]
name = "ai-service"
version = "0.1.0"
description = "HireAssist AI Service — the only component that calls a language model"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "grpcio-health-checking>=1.84.0",
    "grpcio-reflection>=1.84.0",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated from the .proto — never hand-edited, so never linted or formatted.
extend-exclude = ["src/ai_service/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
