openapi: 3.0.3
info:
  title: Hiring Service
  version: 0.3.0
  description: |
    The Hiring Service's operations: job openings (UC-1), screening resumes against them (UC-2)
    and interview guides (UC-3). This document is the contract (ADR-005 rule 1): the server is
    tested against it, and clients are generated from it.

    Lifecycle transitions (pause, resume, close) are POST actions, not PUT or PATCH on a status
    field: each is a rule-bound business event that is not idempotent (a repeat is 409), and
    each maps one-to-one onto an operation in the service operations table. PUT is used only
    where a whole sub-resource is replaced, as with criteria. The Recruiter's decisions on a
    screened resume — override, shortlist — follow the same rule.

    Screening is asynchronous (FR-2.2): submitting a batch answers 202 with the batch, and each
    resume is screened by the Resume Processing Service, reached through the message broker,
    not through this API. Results appear in the ranked list as they arrive.

    Every path sits under `/job-openings`, the one prefix the Gateway routes here. Operation ids
    are the operation names in the service operations table. A service this one depends on
    failing is 502, whichever service it is. Not yet here: role enforcement (FR-0.4).

    Location is provisional — where shared OpenAPI definitions live awaits the
    repository-structure decision.
servers:
  - url: /
tags:
  - name: Job openings
  - name: Screening
  - name: Interview guides
  - name: Operations

paths:
  /job-openings:
    post:
      operationId: createJobOpening
      tags: [Job openings]
      summary: Store a Recruiter-confirmed job opening as open
      description: |
        UC-1 step 6, FR-1.7. Takes criteria the Recruiter has already confirmed — from a
        proposal or entered manually (FR-1.5) — so it makes no AI call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOpeningDraft' }
      responses:
        '201':
          description: Created, in the open state.
          headers:
            Location:
              description: Path of the new job opening.
              schema: { type: string, example: /job-openings/jo_3f9c0a6e1b2d4c5f8a7e6d5c4b3a2918 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listJobOpenings
      tags: [Job openings]
      summary: List every job opening, in creation order
      responses:
        '200':
          description: All job openings; an empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobOpening' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/propose:
    post:
      operationId: proposeJobOpening
      tags: [Job openings]
      summary: Derive a proposed title and criteria from a free-text role description
      description: |
        UC-1 steps 2–3, FR-1.1–FR-1.3. The description, in Thai or English, goes to the AI
        Service; the answer comes back for the Recruiter to review and correct. **Nothing is
        stored** — the confirmed result is created with `createJobOpening()`. When the AI Service
        is down the answer is 502, and the Recruiter enters criteria by hand (FR-1.5).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposalRequest' }
      responses:
        '200':
          description: The proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpeningProposal' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }

  /job-openings/{id}:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    get:
      operationId: getJobOpening
      tags: [Job openings]
      summary: Get one job opening
      responses:
        '200':
          description: The job opening.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/criteria:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    put:
      operationId: reviseScreeningCriteria
      tags: [Job openings]
      summary: Replace the screening criteria of an open or paused job opening
      description: |
        Resumes already handed to screening keep the criteria snapshot they were sent with
        (NFR-15). A closed job opening's criteria cannot be revised (FR-1.9).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriteriaSet' }
      responses:
        '200':
          description: The job opening with its revised criteria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    post:
      operationId: pauseOpening
      tags: [Job openings]
      summary: Put an open job opening on hold
      description: FR-1.8. Pausing also suspends UC-4's staleness alerts for this opening.
      responses:
        '200':
          description: The job opening, now paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    post:
      operationId: resumeOpening
      tags: [Job openings]
      summary: Reopen a paused job opening
      description: FR-1.8.
      responses:
        '200':
          description: The job opening, open again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/close:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    post:
      operationId: closeOpening
      tags: [Job openings]
      summary: Close a job opening with a recorded outcome
      description: FR-1.8. Closing is final (FR-1.9) — the outcome is what UC-4's metrics count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { $ref: '#/components/schemas/Outcome' }
      responses:
        '200':
          description: The job opening, now closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOpening' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/batches:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    post:
      operationId: submitScreeningBatch
      tags: [Screening]
      summary: Submit a batch of resumes to be screened against an open job opening
      description: |
        UC-2 steps 1–2, FR-2.1, FR-2.2. Answers **202** as soon as the batch is recorded,
        without waiting for any resume to be screened. Each PDF is stored and handed to the
        Resume Processing Service through the message broker. A file that is not a PDF, is
        empty, or is larger than 10 MB is left out and listed under `rejected`; the batch is
        refused (422) only when nothing in it can be screened. At most 100 files, 100 MB in all.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ResumeUpload' }
      responses:
        '202':
          description: Accepted. The resumes are being screened.
          headers:
            Location:
              description: Path of the batch, to follow its progress.
              schema: { type: string, example: /job-openings/jo_3f9c0a6e1b2d4c5f8a7e6d5c4b3a2918/batches/sb_7d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningBatch' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '413': { $ref: '#/components/responses/UploadTooLarge' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }

  /job-openings/{id}/batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/BatchId'
    get:
      operationId: getBatchStatus
      tags: [Screening]
      summary: Follow a batch — where each of its resumes stands
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningBatch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/results:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
    get:
      operationId: getRankedResults
      tags: [Screening]
      summary: The screened resumes of a job opening, ranked
      description: |
        FR-2.6, FR-2.7. Across every batch of the opening: resumes that meet every must-have
        first — a must-have is a gate, not a weight — then by score, the Recruiter's override
        standing in for the original. Resumes still being screened are counted in `pending`;
        those that could not be screened are listed apart, never scored. Read from this
        service's own records only, so the list never waits on another service (NFR-03).
        Filtering by criterion works on must-haves: screening reports which must-haves a resume
        missed, and judges the nice-to-haves only through the score.
      parameters:
        - $ref: '#/components/parameters/MinScore'
        - $ref: '#/components/parameters/CriterionName'
      responses:
        '200':
          description: The ranked list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankedResults' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/results/{resumeId}:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/ResumeId'
    get:
      operationId: getScreeningResult
      tags: [Screening]
      summary: Open one screened resume, with the justification for its score
      description: |
        This service's record of the resume, and — once it is screened — the written
        justification and the evidence behind each verdict, read from the Resume Processing
        Service through `getCandidateProfile()` (FR-2.5). This service keeps no copy of them
        (ADR-003). That service being down costs the justification (`null`), not the record.
      responses:
        '200':
          description: The resume and, when available, the justification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenedCandidate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/results/{resumeId}/override:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/ResumeId'
    post:
      operationId: overrideScore
      tags: [Screening]
      summary: Replace a screened resume's score with the Recruiter's own
      description: FR-2.8, UC-2 flow 6a. The original score is kept beside the override.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreOverride' }
      responses:
        '200':
          description: The resume with its overridden score.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningResult' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/results/{resumeId}/shortlist:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/ResumeId'
    post:
      operationId: shortlistCandidate
      tags: [Screening]
      summary: Shortlist a screened candidate for interview
      description: |
        FR-2.9. Only a screened resume can be shortlisted, and only once (a repeat is 409).
        There is no reject: a candidate neither shortlisted nor not qualified stays undecided.
      responses:
        '200':
          description: The resume, now shortlisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreeningResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/candidates/{candidateId}/interview-guide:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: generateInterviewGuide
      tags: [Interview guides]
      summary: Generate the interview guide for one candidate against this opening
      description: |
        UC-3, FR-3.1. Reads the candidate's profile from the Resume Processing Service and asks
        the AI Service for questions covering resume claims, must-have gaps and role depth
        (FR-3.2), each tagged with the criterion it tests and the evidence it came from
        (FR-3.3). The guide is retained, so it can be reopened before the interview.

        A candidate has one guide per opening. When one exists this answers 409: asking the
        model again is `regenerateInterviewGuide`, which cannot be reached by a stray click.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Emphasis' }
      responses:
        '201':
          description: The generated guide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewGuide' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusForbidsIt' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getInterviewGuide
      tags: [Interview guides]
      summary: The retained interview guide for this candidate
      description: FR-3.1 — reopened before the interview rather than generated again.
      responses:
        '200':
          description: The guide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewGuide' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/candidates/{candidateId}/interview-guide/regenerate:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: regenerateInterviewGuide
      tags: [Interview guides]
      summary: Ask the model again, optionally with an emphasis
      description: |
        `reviseGuide()` in its regenerating form. FR-3.4 and UC-3 alternate flow 5a: the
        Recruiter wants a different emphasis, such as more system design. Every question is
        replaced and the revision number moves.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Emphasis' }
      responses:
        '200':
          description: The regenerated guide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewGuide' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '502': { $ref: '#/components/responses/UpstreamUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/candidates/{candidateId}/interview-guide/questions:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/CandidateId'
    put:
      operationId: reviseGuideQuestions
      tags: [Interview guides]
      summary: Replace the questions with the Recruiter's own set
      description: |
        `reviseGuide()` in its editing form. FR-3.4: adding, rewording, reordering and removing
        are one request, because the whole set is sent. No model is called, so the guide no
        longer carries a model attribution — the questions are partly the Recruiter's. A note
        already written against a question that is sent back unchanged stays with it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionDraftSet' }
      responses:
        '200':
          description: The revised guide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewGuide' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRuleViolated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job-openings/{id}/candidates/{candidateId}/interview-guide/questions/{questionId}/note:
    parameters:
      - $ref: '#/components/parameters/JobOpeningId'
      - $ref: '#/components/parameters/CandidateId'
      - name: questionId
        in: path
        required: true
        description: The question's id within the guide, as a read of the guide gives it.
        schema: { type: string }
        example: q2
    put:
      operationId: recordInterviewNote
      tags: [Interview guides]
      summary: Record the interviewer's note against one question
      description: |
        FR-3.5. After the interview, what was said is kept with the question it answers, so the
        evidence stays attached to the criterion that question was meant to test. Sending it
        again replaces it; the guide's revision does not move, because the questions have not
        changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterviewNote' }
      responses:
        '200':
          description: The guide, with the note on its question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewGuide' }
        '400': { $ref: '#/components/responses/MalformedBody' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /healthz:
    get:
      operationId: health
      tags: [Operations]
      summary: Liveness check for the platform (ADR-005 rule 4)
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

components:
  parameters:
    JobOpeningId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: jo_3f9c0a6e1b2d4c5f8a7e6d5c4b3a2918

    CandidateId:
      name: candidateId
      in: path
      required: true
      description: The candidate's id in the Resume Processing Service, which owns it.
      schema: { type: string }
      example: cand-001

    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
      example: sb_7d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema: { type: string }
      example: rs_0a1b2c3d4e5f60718293a4b5c6d7e8f9
    MinScore:
      name: min_score
      in: query
      description: Keep only resumes scoring at least this (the override counting).
      schema: { type: integer, minimum: 0, maximum: 100 }
    CriterionName:
      name: criterion
      in: query
      description: Keep only resumes judged to meet the must-have of this name, in any case.
      schema: { type: string }
      example: 3+ years of Go or Python

  schemas:
    Classification:
      type: string
      enum: [must-have, nice-to-have]
      description: |
        A must-have is a gate — a candidate missing any is marked not qualified (FR-2.5).
        A nice-to-have only contributes to the score through its weight.

    Criterion:
      type: object
      additionalProperties: false
      required: [name, classification, weight]
      properties:
        name: { type: string, minLength: 1, example: 3+ years of Go or Python }
        classification: { $ref: '#/components/schemas/Classification' }
        weight: { type: integer, minimum: 1, example: 5 }

    CriteriaSet:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/Criterion' }

    JobOpeningDraft:
      type: object
      additionalProperties: false
      required: [title, criteria, expected_time_to_fill_days]
      properties:
        title: { type: string, minLength: 1, example: Backend Engineer }
        description:
          type: string
          description: The original free-text role description, retained as written (FR-1.7).
          example: Backend engineer, 3+ years, Go or Python, must have shipped with Kafka.
        criteria: { $ref: '#/components/schemas/CriteriaSet' }
        expected_time_to_fill_days:
          type: integer
          minimum: 1
          description: FR-1.6. UC-4 flags the opening as stale once it has been open longer.
          example: 45

    Status:
      type: string
      enum: [open, paused, closed]

    Outcome:
      type: string
      enum: [filled, cancelled]

    JobOpening:
      type: object
      additionalProperties: false
      required: [id, title, description, criteria, expected_time_to_fill_days, status, opened_at]
      properties:
        id: { type: string, example: jo_3f9c0a6e1b2d4c5f8a7e6d5c4b3a2918 }
        title: { type: string }
        description: { type: string }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/Criterion' }
        expected_time_to_fill_days: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/Status' }
        outcome:
          allOf: [{ $ref: '#/components/schemas/Outcome' }]
          description: Present only once the job opening is closed.
        opened_at: { type: string, format: date-time, description: UTC. }

    QuestionKind:
      type: string
      enum: [resume-claim, must-have-gap, role-depth]
      description: |
        What the question is for (FR-3.2): probing a claim the resume makes, resolving a
        must-have the resume did not evidence, or role-specific depth from the criteria.

    Question:
      type: object
      additionalProperties: false
      required: [id, text, criterion, kind]
      properties:
        id:
          type: string
          description: Identifies the question within its guide, for recording a note against it.
          example: q2
        note:
          type: string
          description: What the interviewer wrote against this question afterwards (FR-3.5).
        text:
          type: string
          minLength: 1
          example: You list Kafka on the Wongnai project — what was the partitioning strategy, and why?
        criterion:
          type: string
          minLength: 1
          description: The criterion this question tests, named as the job opening spells it (FR-3.3).
          example: Has shipped with Kafka
        evidence:
          type: string
          description: |
            The resume claim the question was derived from (FR-3.3). Absent for a must-have the
            resume never mentions, which is itself why it is being asked.
        kind: { $ref: '#/components/schemas/QuestionKind' }

    QuestionSet:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/Question' }

    QuestionDraft:
      type: object
      additionalProperties: false
      required: [text, criterion, kind]
      description: |
        A question as the Recruiter sends it. Ids are the guide's to assign, and a note is
        recorded against a question rather than sent with one.
      properties:
        text: { type: string, minLength: 1 }
        criterion: { type: string, minLength: 1 }
        evidence: { type: string }
        kind: { $ref: '#/components/schemas/QuestionKind' }

    QuestionDraftSet:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/QuestionDraft' }

    InterviewNote:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Empty clears the note.
          example: Answered well on partitioning; vague on rebalancing.

    Emphasis:
      type: object
      additionalProperties: false
      properties:
        emphasis:
          type: string
          description: A steer for the generation, e.g. "more system design" (FR-3.4).
          example: more system design

    ModelAttribution:
      type: object
      nullable: true
      additionalProperties: false
      required: [provider, model, prompt_version]
      description: |
        Which model produced an AI-derived answer — a job opening proposal, a guide's questions —
        so it can still be accounted for months later (ADR-004). `canned` marks a scripted answer
        from a demo run. Null once a Recruiter has edited a guide's questions.
      properties:
        provider: { type: string, example: anthropic }
        model: { type: string }
        prompt_version: { type: string }

    InterviewGuide:
      type: object
      additionalProperties: false
      required: [id, job_opening_id, candidate_id, questions, source, attribution, revision, created_at, updated_at]
      properties:
        id: { type: string, example: ig_9c1f0b7e2d3a4b5c6d7e8f9a0b1c2d3e }
        job_opening_id: { type: string }
        candidate_id: { type: string }
        questions: { $ref: '#/components/schemas/QuestionSet' }
        emphasis:
          type: string
          description: The steer the last generation was asked for, absent when none was given.
        source:
          type: string
          enum: [generated, edited]
          description: Whether the questions are the model's or the Recruiter's.
        attribution: { $ref: '#/components/schemas/ModelAttribution' }
        revision:
          type: integer
          minimum: 1
          description: Moves on every generation and every edit.
        created_at: { type: string, format: date-time, description: UTC. }
        updated_at: { type: string, format: date-time, description: UTC. }

    ProposalRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          description: The role as it was described, in Thai or English (FR-1.1).
          example: Backend engineer, 3+ years, Go or Python, must have shipped something with Kafka or RabbitMQ.
        language:
          type: string
          enum: [th, en]
          description: The description's language. Leave it out and the AI Service works it out.

    JobOpeningProposal:
      type: object
      additionalProperties: false
      required: [title, criteria, uninterpreted, attribution]
      properties:
        title: { type: string, example: Backend Engineer }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/Criterion' }
        uninterpreted:
          type: array
          description: Parts of the description the model could not interpret, to be filled in by hand (FR-1.5).
          items: { type: string }
        attribution: { $ref: '#/components/schemas/ModelAttribution' }

    ResumeUpload:
      type: object
      additionalProperties: false
      required: [resumes]
      properties:
        resumes:
          type: array
          minItems: 1
          maxItems: 100
          description: One part per resume file, each a PDF of at most 10 MB.
          items: { type: string, format: binary }

    EntryStatus:
      type: string
      enum: [pending, screened, needs_review, failed]
      description: |
        `pending` — being screened. `screened` — scored and ranked. `needs_review` — could not be
        parsed or scored (a scanned image, a corrupt file) and is left out of the ranking (FR-2.7).
        `failed` — screening gave up after its retries.

    ScreeningBatch:
      type: object
      additionalProperties: false
      required: [id, job_opening_id, submitted_at, complete, counts, entries]
      properties:
        id: { type: string, example: sb_7d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a }
        job_opening_id: { type: string }
        submitted_at: { type: string, format: date-time, description: UTC. }
        complete: { type: boolean, description: True once no resume is pending. }
        counts:
          type: object
          additionalProperties: false
          required: [pending, screened, needs_review, failed]
          properties:
            pending: { type: integer, minimum: 0 }
            screened: { type: integer, minimum: 0 }
            needs_review: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [resume_id, file_name, status]
            properties:
              resume_id: { type: string, example: rs_0a1b2c3d4e5f60718293a4b5c6d7e8f9 }
              file_name: { type: string, example: ploy-resume.pdf }
              status: { $ref: '#/components/schemas/EntryStatus' }
        rejected:
          type: array
          description: Only in the answer to the upload — files left out of the batch, and why.
          items:
            type: object
            additionalProperties: false
            required: [file_name, reason]
            properties:
              file_name: { type: string, example: notes.docx }
              reason: { type: string, example: not a PDF }

    ScreeningResult:
      type: object
      additionalProperties: false
      required: [resume_id, batch_id, file_name, status, shortlisted]
      description: |
        One resume as the Recruiter sees it (FR-2.5). The score fields are present once it is
        screened; `reason` only when it could not be. The written justification is not here: it
        is held by the Resume Processing Service and arrives with `getScreeningResult()`.
      properties:
        resume_id: { type: string }
        batch_id: { type: string }
        file_name: { type: string }
        status: { $ref: '#/components/schemas/EntryStatus' }
        candidate_id: { type: string, description: 'Assigned by the Resume Processing Service, which owns candidate identity.' }
        score: { type: integer, minimum: 0, maximum: 100, description: The score ranked on — the Recruiter's override when there is one. }
        original_score: { type: integer, minimum: 0, maximum: 100, description: Present only when overridden — screening's own score (FR-2.8). }
        overridden_at: { type: string, format: date-time }
        qualified: { type: boolean, description: False when a must-have is unmet; the candidate is then marked not qualified (FR-2.5). }
        unmet_must_haves:
          type: array
          description: The must-haves that made the candidate not qualified.
          items: { type: string }
        shortlisted: { type: boolean }
        shortlisted_at: { type: string, format: date-time }
        reason: { type: string, description: 'Why the resume needs review, or failed.' }
        completed_at: { type: string, format: date-time }

    RankedResults:
      type: object
      additionalProperties: false
      required: [job_opening_id, pending, ranked, needs_review]
      properties:
        job_opening_id: { type: string }
        pending: { type: integer, minimum: 0, description: Resumes still being screened; the ranking fills in as they finish. }
        ranked:
          type: array
          description: Screened resumes, best first.
          items: { $ref: '#/components/schemas/ScreeningResult' }
        needs_review:
          type: array
          description: Resumes that could not be screened, in submission order — never ranked (FR-2.7).
          items: { $ref: '#/components/schemas/ScreeningResult' }

    ScreenedCandidate:
      type: object
      additionalProperties: false
      required: [result, justification]
      properties:
        result: { $ref: '#/components/schemas/ScreeningResult' }
        justification:
          type: object
          nullable: true
          additionalProperties: false
          required: [text, evidence]
          description: |
            Why screening scored the resume as it did, read from the Resume Processing Service.
            Null until the resume is screened, or when that service did not answer.
          properties:
            text: { type: string, example: Six years of Go at two companies; no Kafka in production. }
            evidence:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [criterion, classification, met, score, evidence]
                properties:
                  criterion: { type: string }
                  classification: { $ref: '#/components/schemas/Classification' }
                  met: { type: boolean }
                  score: { type: integer }
                  evidence: { type: string, description: The words in the resume the verdict rests on. }

    ScoreOverride:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, example: 85 }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

  responses:
    MalformedBody:
      description: The body is not valid JSON, or has fields the contract does not define.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MalformedRequest:
      description: |
        The request cannot be read: an upload that is not multipart/form-data or has no files
        in `resumes`, or a query parameter out of range.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UploadTooLarge:
      description: The upload is larger than 100 MB as a whole; split it into smaller batches.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        Nothing here has this id: no such job opening, batch or resume, no guide generated for
        this candidate yet, no such question in the guide, or no such candidate profile in the
        Resume Processing Service.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StatusForbidsIt:
      description: |
        The job opening's current status does not allow this — e.g. it is closed (FR-1.9) — or
        the candidate already has a guide for it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BusinessRuleViolated:
      description: |
        The request is well-formed but breaks a business rule: no criteria, a non-positive
        weight, an unknown classification or outcome, no expected time-to-fill.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamUnavailable:
      description: |
        A service this operation needs could not answer — the AI Service, the Resume Processing
        Service, or resume storage. Saying so beats an empty answer. Proposing a job opening
        without the AI Service: enter the criteria by hand. Submitting a batch without storage:
        nothing of it was recorded; submit it again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected failure. No internal detail is returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
