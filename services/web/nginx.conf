server {
  listen 80;
  root /usr/share/nginx/html;

  # API calls: the trailing slash on proxy_pass removes the /api prefix, so the gateway sees
  # its own routes (/auth/*, /job-openings/*). Uploads can be a whole batch of resumes.
  location /api/ {
    proxy_pass http://gateway:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
    # The gateway scopes the refresh cookie to /auth; the browser calls /api/auth.
    proxy_cookie_path /auth /api/auth;
  }

  # Every other path is a page of the single-page app.
  location / {
    try_files $uri /index.html;
  }
}
