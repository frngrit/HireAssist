# ADR-001: each service is a Deployment behind a ClusterIP Service.
# Other services reach it at http://resume-processing.hireassist.svc
# The readiness probe passes only when MongoDB and RabbitMQ are both connected.
#
# Credentials come from Secrets, never from this file:
#   kubectl -n hireassist create secret generic resume-processing \
#     --from-literal=MONGO_URL='mongodb://...' \
#     --from-literal=AMQP_URL='amqp://user:pass@rabbitmq.hireassist.svc:5672' \
#     --from-literal=S3_ACCESS_KEY='...' --from-literal=S3_SECRET_KEY='...'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-processing
  namespace: hireassist
  labels:
    app: resume-processing
spec:
  replicas: 2 # both consume screening.requested; RabbitMQ shares the work
  selector:
    matchLabels:
      app: resume-processing
  template:
    metadata:
      labels:
        app: resume-processing
    spec:
      containers:
        - name: resume-processing
          image: hireassist/resume-processing:2.0.0
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: AI_SERVICE_ADDR
              value: "ai-service.hireassist.svc:50051"
            - name: S3_ENDPOINT
              value: "http://minio.hireassist.svc:9000"
            - name: MONGO_URL
              valueFrom: { secretKeyRef: { name: resume-processing, key: MONGO_URL } }
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: resume-processing, key: AMQP_URL } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: resume-processing, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: resume-processing, key: S3_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: resume-processing
  namespace: hireassist
spec:
  type: ClusterIP
  selector:
    app: resume-processing
  ports:
    - port: 80
      targetPort: 3000
